<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1216"/>
      <stop offset="100%" stop-color="#1E0A0D"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- Typography Layout Grid -->
  <g transform="translate(100, 160)">
    <rect width="600" height="520" rx="24" fill="#FAFAF9" stroke="#C59A9F" stroke-width="2"/>
    <text x="300" y="160" text-anchor="middle" fill="#6B1D2F" font-family="'Roboto', sans-serif" font-weight="900" font-size="64" letter-spacing="8">TYPECRAFT</text>
    <line x1="80" y1="210" x2="520" y2="210" stroke="#6B1D2F" stroke-width="4"/>
    <text x="300" y="270" text-anchor="middle" fill="#1C1917" font-family="'Roboto', sans-serif" font-weight="700" font-size="22" letter-spacing="10">EDITORIAL LETTERING</text>
    <text x="300" y="380" text-anchor="middle" fill="#78716C" font-family="'Roboto', sans-serif" font-weight="300" font-size="70" letter-spacing="12">Aa Bb Cc 0123</text>
  </g>

  <text x="400" y="800" text-anchor="middle" fill="#FAFAF9" font-family="'Roboto', sans-serif" font-weight="900" font-size="38" letter-spacing="4">CUSTOM TYPOGRAPHY</text>
  <text x="400" y="845" text-anchor="middle" fill="#C59A9F" font-family="'Roboto', sans-serif" font-weight="700" font-size="16" letter-spacing="6">TYPEFACE & HAND-LETTERING</text>
</svg>
