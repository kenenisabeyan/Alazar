<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0E19"/>
      <stop offset="100%" stop-color="#8B1E3F"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- Phone Mockup Grid -->
  <g transform="translate(250, 160)">
    <rect width="300" height="560" rx="36" fill="#FAFAF9" stroke="#C59A9F" stroke-width="4"/>
    <rect x="100" y="15" width="100" height="18" rx="9" fill="#1C1917"/>

    <!-- 9-Grid Posts -->
    <g transform="translate(20, 60)">
      <rect width="80" height="80" rx="8" fill="#6B1D2F"/>
      <rect x="90" width="80" height="80" rx="8" fill="#C59A9F"/>
      <rect x="180" width="80" height="80" rx="8" fill="#3B0E19"/>

      <rect y="90" width="80" height="80" rx="8" fill="#C59A9F"/>
      <rect x="90" y="90" width="80" height="80" rx="8" fill="#6B1D2F"/>
      <rect x="180" y="90" width="80" height="80" rx="8" fill="#FAFAF9" stroke="#6B1D2F"/>

      <rect y="180" width="80" height="80" rx="8" fill="#3B0E19"/>
      <rect x="90" y="180" width="80" height="80" rx="8" fill="#FAFAF9" stroke="#C59A9F"/>
      <rect x="180" y="180" width="80" height="80" rx="8" fill="#6B1D2F"/>
    </g>
  </g>

  <text x="400" y="800" text-anchor="middle" fill="#FAFAF9" font-family="'Roboto', sans-serif" font-weight="900" font-size="38" letter-spacing="4">FEED & MOBILE UI</text>
  <text x="400" y="845" text-anchor="middle" fill="#C59A9F" font-family="'Roboto', sans-serif" font-weight="700" font-size="16" letter-spacing="6">SOCIAL MEDIA GRID STRATEGY</text>
</svg>
