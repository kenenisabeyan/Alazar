<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B1D2F"/>
      <stop offset="50%" stop-color="#3B0E19"/>
      <stop offset="100%" stop-color="#1E0A0D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59A9F"/>
      <stop offset="100%" stop-color="#FAFAF9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- Geometric Grid & Lines -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1.5" fill="none">
    <line x1="100" y1="0" x2="100" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="700" y1="0" x2="700" y2="1000"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
    <circle cx="400" cy="500" r="300"/>
  </g>

  <!-- Film Frame Center Overlay -->
  <rect x="120" y="240" width="560" height="420" rx="24" fill="#1E0A0D" opacity="0.8" stroke="#C59A9F" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Play Badge -->
  <circle cx="400" cy="450" r="48" fill="url(#gold)" filter="url(#shadow)"/>
  <polygon points="390,430 420,450 390,470" fill="#6B1D2F"/>

  <!-- Typography -->
  <text x="400" y="730" text-anchor="middle" fill="#FAFAF9" font-family="'Roboto', sans-serif" font-weight="900" font-size="44" letter-spacing="4">URBAN ECHOES</text>
  <text x="400" y="775" text-anchor="middle" fill="#C59A9F" font-family="'Roboto', sans-serif" font-weight="700" font-size="18" letter-spacing="6">COMMERCIAL VIDEO REEL • 2025</text>
  
  <!-- Category Badge -->
  <rect x="300" y="140" width="200" height="36" rx="18" fill="#6B1D2F" stroke="#C59A9F" stroke-width="1.5"/>
  <text x="400" y="163" text-anchor="middle" fill="#FAFAF9" font-family="'Roboto', sans-serif" font-weight="900" font-size="12" letter-spacing="3">VIDEO PRODUCTION</text>
</svg>
