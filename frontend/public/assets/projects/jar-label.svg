<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B1D2F"/>
      <stop offset="100%" stop-color="#2E1216"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- Jar Container Mockup -->
  <g transform="translate(240, 200)">
    <ellipse cx="160" cy="50" rx="140" ry="25" fill="#C59A9F"/>
    <rect x="20" y="50" width="280" height="460" rx="40" fill="#FAFAF9" stroke="#C59A9F" stroke-width="3"/>
    <!-- Label -->
    <rect x="40" y="160" width="240" height="240" rx="16" fill="#6B1D2F"/>
    <circle cx="160" cy="240" r="50" fill="#FAFAF9"/>
    <text x="160" y="246" text-anchor="middle" fill="#6B1D2F" font-family="'Roboto', sans-serif" font-weight="900" font-size="18" letter-spacing="2">RUDEKU</text>
    <text x="160" y="320" text-anchor="middle" fill="#FAFAF9" font-family="'Roboto', sans-serif" font-weight="700" font-size="12" letter-spacing="3">GOURMET JAR</text>
  </g>

  <text x="400" y="780" text-anchor="middle" fill="#FAFAF9" font-family="'Roboto', sans-serif" font-weight="900" font-size="38" letter-spacing="4">JAR LABEL DESIGN</text>
  <text x="400" y="825" text-anchor="middle" fill="#C59A9F" font-family="'Roboto', sans-serif" font-weight="700" font-size="16" letter-spacing="6">ARTISANAL PACKAGING & LABELS</text>
</svg>
