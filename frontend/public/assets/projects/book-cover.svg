<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0E19"/>
      <stop offset="100%" stop-color="#6B1D2F"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- 3D Hardcover Book Layout -->
  <g transform="translate(200, 180)">
    <rect width="400" height="540" rx="16" fill="#FAFAF9" stroke="#C59A9F" stroke-width="3"/>
    <rect width="35" height="540" fill="#6B1D2F"/>
    <text x="220" y="180" text-anchor="middle" fill="#6B1D2F" font-family="'Roboto', sans-serif" font-weight="900" font-size="34" letter-spacing="4">NOVELIST</text>
    <line x1="100" y1="220" x2="340" y2="220" stroke="#C59A9F" stroke-width="3"/>
    <text x="220" y="270" text-anchor="middle" fill="#1C1917" font-family="'Roboto', sans-serif" font-weight="700" font-size="14" letter-spacing="6">BOOK COVER DESIGN</text>
    <circle cx="220" cy="380" r="60" fill="#6B1D2F" opacity="0.85"/>
  </g>

  <text x="400" y="810" text-anchor="middle" fill="#FAFAF9" font-family="'Roboto', sans-serif" font-weight="900" font-size="36" letter-spacing="4">BOOK COVER DESIGN</text>
  <text x="400" y="855" text-anchor="middle" fill="#C59A9F" font-family="'Roboto', sans-serif" font-weight="700" font-size="16" letter-spacing="6">3D HARDCOVER & SPREADS</text>
</svg>
